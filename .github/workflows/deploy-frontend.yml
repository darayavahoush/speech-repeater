name: Deploy frontend
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-frontend
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Prepare Azure CLI
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Build image in ACR
        run: >
          az acr build --registry vaakifyacr
          --image vaakify-frontend:${{ github.sha }}
          --image vaakify-frontend:latest
          --build-arg VITE_GOOGLE_CLIENT_ID=997302508370-7c97dm4p2ibfa62pj769ndijueifooik.apps.googleusercontent.com
          --build-arg VITE_API_BASE_URL=https://api.vaakify.manaslearning.com
          ./frontend
      - name: Deploy to Container Apps
        run: >
          az containerapp update -g vaakify-rg -n vaakify-frontend
          --image vaakifyacr.azurecr.io/vaakify-frontend:${{ github.sha }}
