name: Deploy backend
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-backend
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Prepare Azure CLI
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Build image in ACR
        run: >
          az acr build --registry vaakifyacr
          --image vaakify-backend:${{ github.sha }}
          --image vaakify-backend:latest ./backend
      - name: Deploy to Container Apps
        run: >
          az containerapp update -g vaakify-rg -n vaakify-backend
          --image vaakifyacr.azurecr.io/vaakify-backend:${{ github.sha }}
